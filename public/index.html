
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#102a43" />
    <meta name="color-scheme" content="light" />

    <!-- SEO -->
    <title>Carewell Multispeciality Clinic | Compassionate Healthcare</title>

    <meta
      name="description"
      content="Discover compassionate, patient-focused healthcare at Carewell Multispeciality Clinic. Explore medical specialities, treatment and care services, and appointment options."
    />

    <meta name="application-name" content="Carewell Multispeciality Clinic" />
    <meta name="author" content="Carewell Multispeciality Clinic" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Replace with your actual deployed clinic website URL -->
    <link rel="canonical" href="https://your-clinic-domain.com/" />

    <!-- Open Graph: WhatsApp, Facebook and other social previews -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Carewell Multispeciality Clinic | Compassionate Healthcare"
    />
    <meta
      property="og:description"
      content="Your health deserves thoughtful care. Explore our medical specialities, treatment services, and appointment options."
    />
    <meta property="og:site_name" content="Carewell Multispeciality Clinic" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://your-clinic-domain.com/" />

    <!-- Replace with your real, publicly accessible clinic cover image -->
    <meta
      property="og:image"
      content="https://your-clinic-domain.com/clinic-og-image.jpg"
    />
    <meta
      property="og:image:alt"
      content="Carewell Multispeciality Clinic"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Carewell Multispeciality Clinic | Compassionate Healthcare"
    />
    <meta
      name="twitter:description"
      content="Explore medical specialities, treatment and care services, and appointment options at Carewell Multispeciality Clinic."
    />
    <meta
      name="twitter:image"
      content="https://your-clinic-domain.com/clinic-og-image.jpg"
    />

    <!-- App icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Font loading optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Premium clinic typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use the Carewell Multispeciality Clinic website.
    </noscript>

    <div id="root"></div>
  </body>
</html>
